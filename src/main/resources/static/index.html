<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioBoard | Pro AI Whiteboard</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --accent: #3b82f6;
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --canvas: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 32px 32px;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- DYNAMIC TOOL CURSOR --- */
        #cursor-follower {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            display: none;
            transform: translate(-10%, -90%);
            /* Offset so tip of tool aligns with mouse */
        }

        .tool-icon-svg {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        /* Brush size preview circle */
        #size-preview {
            position: absolute;
            top: 100%;
            /* Position at the "tip" of the tool */
            left: 0;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background: rgba(0, 0, 0, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* --- APP UI --- */
        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .brand-logo {
            background: var(--accent);
            padding: 6px;
            border-radius: 8px;
            display: flex;
        }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #board {
            background: var(--canvas);
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            cursor: none;
            /* Hide real cursor */
        }

        /* Floating Tool Dock */
        l-dock {
            position: absolute;
            bottom: 30px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .dock-item {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .dock-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .dock-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        /* Properties Panel */
        .properties-panel {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 20px 15px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .prop-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .prop-label {
            font-size: 10px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
        }

        input[type="color"] {
            appearance: none;
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 50%;
            border: none;
        }

        .v-slider {
            writing-mode: bt-lr;
            appearance: slider-vertical;
            width: 6px;
            height: 120px;
            accent-color: var(--accent);
        }

        .btn-top {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-top:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <!-- Professional Ghost Cursor -->
    <div id="cursor-follower">
        <!-- Pencil SVG -->
        <svg id="svg-pencil" class="tool-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #000;">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
        </svg>
        <!-- Eraser SVG -->
        <svg id="svg-eraser" class="tool-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #475569; display: none;">
            <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
            <path d="M22 21H7"></path>
            <path d="m5 11 9 9"></path>
        </svg>
        <div id="size-preview"></div>
    </div>

    <header>
        <div class="brand">
            <div class="brand-logo"><i data-lucide="layers" color="white" size="20"></i></div>
            StudioBoard Pro
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="btn-top" onclick="undo()"><i data-lucide="undo-2" size="16"></i> Undo</button>
            <button class="btn-top" onclick="clearBoard()" style="color: #fb7185;"><i data-lucide="trash-2"
                    size="16"></i> Clear</button>
        </div>
    </header>

    <main class="workspace">
        <canvas id="board"></canvas>

        <!-- Right Side: Properties -->
        <div class="properties-panel">
            <div class="prop-group">
                <span class="prop-label">Color</span>
                <input type="color" id="colorPicker" value="#3b82f6">
            </div>
            <div class="prop-group">
                <span class="prop-label">Size</span>
                <input type="range" id="brushSize" class="v-slider" min="2" max="60" value="8">
            </div>
        </div>

        <!-- Bottom: Tools Dock -->
        <div class="tool-dock">
            <button id="drawBtn" class="dock-item active" onclick="setMode('draw')" title="Pencil">
                <i data-lucide="pencil"></i>
            </button>
            <button id="eraseBtn" class="dock-item" onclick="setMode('erase')" title="Eraser">
                <i data-lucide="eraser"></i>
            </button>
            <div style="width: 1px; height: 30px; background: var(--border); margin: 0 4px;"></div>
            <button class="dock-item" onclick="downloadImage()" title="Export">
                <i data-lucide="download"></i>
            </button>
            <button id="saveBtn" class="dock-item" onclick="saveToDatabase()" title="Save to Database">
                <i data-lucide="cloud-upload"></i>
            </button>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const canvas = document.getElementById("board");
        const ctx = canvas.getContext("2d");
        const follower = document.getElementById("cursor-follower");
        const sizePreview = document.getElementById("size-preview");
        const pencilSvg = document.getElementById("svg-pencil");
        const eraserSvg = document.getElementById("svg-eraser");

        let drawing = false;
        let mode = 'draw';
        let history = [];

        // --- WebSocket Setup ---
        let socket = new SockJS('/whiteboard');
        let stompClient = Stomp.over(socket);
        stompClient.debug = null; // Clean console

        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/draw', function (message) {
                renderPoint(JSON.parse(message.body));
            });
        });
        // A temporary list to hold points that are not yet in the database
        let unsavedStrokes = [];

        // Create a notification element
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerText = 'Project Saved to Cloud!';
        document.body.appendChild(toast);

        function showToast() {
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }

        // UPDATE YOUR DRAWING LOGIC
        canvas.addEventListener("mousedown", (e) => {
            drawing = true;
            history.push(canvas.toDataURL());

            const data = {
                x: e.offsetX,
                y: e.offsetY,
                color: (mode === 'erase') ? '#ffffff' : document.getElementById("colorPicker").value,
                size: document.getElementById("brushSize").value,
                type: 'START'
            };

            renderPoint(data);
            unsavedStrokes.push(data); // ADD TO BUFFER
            stompClient.send("/app/draw", {}, JSON.stringify(data));
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!drawing) return;

            const data = {
                x: e.offsetX,
                y: e.offsetY,
                color: (mode === 'erase') ? '#ffffff' : document.getElementById("colorPicker").value,
                size: document.getElementById("brushSize").value,
                type: 'MOVE'
            };

            renderPoint(data);
            unsavedStrokes.push(data); // ADD TO BUFFER
            stompClient.send("/app/draw", {}, JSON.stringify(data));
        });

        // NEW FUNCTION: SAVE TO DATABASE
        async function saveToDatabase() {
            if (unsavedStrokes.length === 0) {
                alert("No new changes to save!");
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.style.opacity = "0.5";
            saveBtn.disabled = true;

            try {
                const response = await fetch('/strokes/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(unsavedStrokes)
                });

                if (response.ok) {
                    unsavedStrokes = []; // Clear the buffer after successful save
                    showToast();
                }
            } catch (error) {
                console.error("Save failed", error);
                alert("Could not connect to server to save.");
            } finally {
                saveBtn.style.opacity = "1";
                saveBtn.disabled = false;
            }
        }
        // --- Canvas Initialization ---
        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = 1000 * dpr;
            canvas.height = 600 * dpr;
            canvas.style.width = '1000px';
            canvas.style.height = '600px';
            ctx.scale(dpr, dpr);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }
        initCanvas();

        // --- Database Sync (On Page Load) ---
        fetch("/strokes")
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    data.forEach(point => renderPoint(point));
                    // Reset path after loading history so next click starts fresh
                    ctx.beginPath();
                }
            });

        // --- Master Rendering Function ---
        // This handles both START (mousedown) and MOVE (mousemove) states
        function renderPoint(data) {
            ctx.strokeStyle = data.color;
            ctx.lineWidth = data.size;

            if (data.type === 'START') {
                ctx.beginPath();
                ctx.moveTo(data.x, data.y);
            } else {
                ctx.lineTo(data.x, data.y);
                ctx.stroke();
            }
        }

        // --- Interaction Logic ---
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            follower.style.left = e.clientX + 'px';
            follower.style.top = e.clientY + 'px';

            const onCanvas = e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom;
            follower.style.display = onCanvas ? 'block' : 'none';

            if (onCanvas) {
                const size = document.getElementById("brushSize").value;
                sizePreview.style.width = size + 'px';
                sizePreview.style.height = size + 'px';
                // Precise alignment for tool tips
                follower.style.transform = mode === 'draw' ? 'translate(-2px, -30px)' : 'translate(-10px, -20px)';
            }
        });

        canvas.addEventListener("mousedown", (e) => {
            drawing = true;
            history.push(canvas.toDataURL());

            const data = {
                x: e.offsetX,
                y: e.offsetY,
                color: (mode === 'erase') ? '#ffffff' : document.getElementById("colorPicker").value,
                size: document.getElementById("brushSize").value,
                type: 'START'
            };

            renderPoint(data);
            stompClient.send("/app/draw", {}, JSON.stringify(data));
        });

        canvas.addEventListener("mousemove", (e) => {
            if (!drawing) return;

            const data = {
                x: e.offsetX,
                y: e.offsetY,
                color: (mode === 'erase') ? '#ffffff' : document.getElementById("colorPicker").value,
                size: document.getElementById("brushSize").value,
                type: 'MOVE'
            };

            renderPoint(data);
            stompClient.send("/app/draw", {}, JSON.stringify(data));
        });

        canvas.addEventListener("mouseup", () => {
            drawing = false;
            ctx.beginPath(); // Lift pen locally
        });

        // --- UI Controls ---
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('drawBtn').classList.toggle('active', mode === 'draw');
            document.getElementById('eraseBtn').classList.toggle('active', mode === 'erase');
            pencilSvg.style.display = (mode === 'draw') ? 'block' : 'none';
            eraserSvg.style.display = (mode === 'erase') ? 'block' : 'none';
        }

        function clearBoard() {
            if (confirm("This clears your current screen view. Drawings are permanent in Database.")) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function undo() {
            if (history.length === 0) return;
            const img = new Image();
            img.src = history.pop();
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, 1000, 600);
            };
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'studioboard-export.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>

</html>
